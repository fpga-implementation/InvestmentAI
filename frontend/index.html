<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestmentAI - Access Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 350px; 
            border: 1px solid #333;
        }
        .tabs { 
            display: flex; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #333; 
        }
        .tab { 
            flex: 1; 
            padding: 10px; 
            text-align: center; 
            cursor: pointer; 
            background: #1e1e1e; 
            color: #888; 
            border: none; 
            font-weight: bold; 
            font-size: 13px;
        }
        .tab.active { 
            background: #2a2a2a; 
            color: #3498db; 
            border-bottom: 2px solid #3498db; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-size: 14px; 
            color: #bbb; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            background: #2c2c2c; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 4px; 
        }
        input:focus { 
            border-color: #3498db; 
            outline: none; 
        }
        button.action-btn { 
            width: 100%; 
            padding: 10px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button.action-btn:hover { 
            background: #2980b9; 
        }
        .banner { 
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 4px; 
            display: none; 
            font-size: 14px; 
        }
        .success { background-color: #1e3a2f; color: #2ecc71; border: 1px solid #27ae60; }
        .error { background-color: #3c1f1f; color: #e74c3c; border: 1px solid #c0392b; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
            <button class="tab" onclick="switchTab('request')">Request Access</button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <div id="login-banner" class="banner"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password">
            </div>
            <button class="action-btn" onclick="handleLogin()">Log In</button>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="hidden">
            <div id="register-banner" class="banner"></div>
            <div class="form-group">
                <label>Approved Email</label>
                <input type="email" id="register-email">
            </div>
            <div class="form-group">
                <label>Choose Username</label>
                <input type="text" id="register-username">
            </div>
            <div class="form-group">
                <label>Choose Password</label>
                <input type="password" id="register-password">
            </div>
            <button class="action-btn" onclick="register()">Complete Registration</button>
        </div>

        <!-- Request Access Form -->
        <div id="request-form" class="hidden">
            <div id="request-banner" class="banner"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="request-email">
            </div>
            <button class="action-btn" onclick="requestAccess()">Request Access</button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function switchTab(tabName) {
            document.getElementById("login-form").classList.add("hidden");
            document.getElementById("register-form").classList.add("hidden");
            document.getElementById("request-form").classList.add("hidden");
            
            const tabs = document.getElementsByClassName("tab");
            for(let t of tabs) t.classList.remove("active");

            if(tabName === 'login') {
                document.getElementById("login-form").classList.remove("hidden");
                tabs[0].classList.add("active");
            } else if(tabName === 'register') {
                document.getElementById("register-form").classList.remove("hidden");
                tabs[1].classList.add("active");
            } else if(tabName === 'request') {
                document.getElementById("request-form").classList.remove("hidden");
                tabs[2].classList.add("active");
            }
        }

        function showBanner(bannerId, message, type) {
            const banner = document.getElementById(bannerId);
            banner.style.display = "block";
            banner.className = `banner ${type}`;
            banner.innerText = message;
        }

        async function handleLogin() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            
            if(!username || !password) {
                showBanner("login-banner", "Please fill in all fields.", "error");
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if(response.ok) {
                    localStorage.setItem("investment_username", username);
                    window.location.href = "dashboard.html";
                } else {
                    showBanner("login-banner", data.detail || "Login failed.", "error");
                }
            } catch(error) {
                showBanner("login-banner", "Network error. Is the server running?", "error");
            }
        }

        async function register() {
            const email = document.getElementById("register-email").value;
            const username = document.getElementById("register-username").value;
            const password = document.getElementById("register-password").value;
            
            if(!email || !username || !password) {
                showBanner("register-banner", "Please fill in all fields.", "error");
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, username, password })
                });
                const data = await response.json();
                
                if(response.ok) {
                    showBanner("register-banner", "Registration successful! You can now log in.", "success");
                    document.getElementById("register-email").value = "";
                    document.getElementById("register-username").value = "";
                    document.getElementById("register-password").value = "";
                } else {
                    showBanner("register-banner", data.detail || "Registration failed.", "error");
                }
            } catch(error) {
                showBanner("register-banner", "Network error. Is the server running?", "error");
            }
        }

        async function requestAccess() {
            const email = document.getElementById("request-email").value;
            
            if(!email) {
                showBanner("request-banner", "Please enter your email.", "error");
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/request-account`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                
                if(response.ok) {
                    showBanner("request-banner", data.message, "success");
                    document.getElementById("request-email").value = "";
                } else {
                    showBanner("request-banner", data.detail || "Request failed.", "error");
                }
            } catch(error) {
                showBanner("request-banner", "Network error. Is the server running?", "error");
            }
        }
    </script>
</body>
</html>
