<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGUYENILY — Investment AI Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0a09;
            --bg-surface: rgba(24, 24, 27, 0.88);
            --border-color: rgba(251, 191, 36, 0.22);
            --border-glow: rgba(251, 191, 36, 0.45);
            --text-primary: #fefce8;
            --text-secondary: #a1a1aa;
            --accent-primary: #fbbf24;
            --radius: 14px;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: radial-gradient(circle at 50% 0%, #292524 0%, var(--bg-main) 75%);
            color: var(--text-primary); 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(251, 191, 36, 0.1);
            text-align: center;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, #fde047 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            background: rgba(12, 10, 9, 0.95);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #d97706;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-login:hover {
            background: #f59e0b;
            box-shadow: 0 6px 18px rgba(251, 191, 36, 0.5);
            transform: translateY(-1px);
        }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>NGUYENILY</h1>
        <p>Investment AI Terminal</p>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">Enter Terminal</button>
            <div id="error-msg" class="error-msg">Please enter a valid username.</div>
        </form>
    </div>

    <script>
        // If already logged in, skip login screen and redirect directly to dashboard
        if (localStorage.getItem("investment_username")) {
            window.location.href = "dashboard.html";
        }

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("username").value.trim();
            if (usernameInput) {
                localStorage.setItem("investment_username", usernameInput);
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
