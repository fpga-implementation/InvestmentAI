<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestmentAI - Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; /* Dark Grey background */
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
        }
        
        /* Header Grid Layout (Black Title Bar) */
        .header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr;
            align-items: center; 
            background: #000000; /* Black title bar */
            padding: 15px 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); 
            margin-bottom: 20px; 
            border: 1px solid #333;
        }
        .header-left { justify-self: start; }
        .header-center { justify-self: center; display: flex; align-items: center; }
        .header-right { justify-self: end; display: flex; align-items: center; }
        
        .header h2 { margin: 0; color: #ffffff; font-size: 20px; }
        .logout-btn { background: #c0392b; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #e74c3c; }
        
        /* Collapsible Section Styles (Reverted Input Tickers Bar to #1e1e1e) */
        .collapsible { 
            background-color: #1e1e1e; /* Reverted to original dark theme color */
            color: #ffffff; 
            cursor: pointer; 
            padding: 15px; 
            width: 100%; 
            border: 1px solid #333; 
            text-align: left; 
            outline: none; 
            font-size: 18px; 
            border-radius: 5px; 
            margin-bottom: 5px; 
            display: flex; 
            justify-content: space-between;
            font-weight: bold;
        }
        .collapsible:hover { background-color: #2a2a2a; }
        .collapsible:after { content: '\002B'; font-weight: bold; color: #3498db; }
        .active:after { content: "\2212"; }
        .content { 
            padding: 0 18px; 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.2s ease-out; 
            background-color: #181818; /* Dark grey content background */
            border-radius: 0 0 5px 5px; 
            margin-bottom: 15px; 
            border: 1px solid #333;
            border-top: none;
        }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 9px; 
            box-sizing: border-box; 
            background: #2c2c2c; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 4px; 
        }
        input:focus { border-color: #3498db; outline: none; }
        
        /* Button Styles */
        .controls { padding: 20px 0; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-clear { background: #4f5b66; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-clear:hover { background: #65737e; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { background: #2ecc71; }
        
        #message-box { padding: 12px; margin-top: 15px; display: none; border-radius: 4px; font-size: 14px; }
        .success { background-color: #1e3a2f; color: #2ecc71; border: 1px solid #27ae60; }
        .error { background-color: #3c1f1f; color: #e74c3c; border: 1px solid #c0392b; }
    </style>
</head>
<body>

    <!-- Title Bar with Custom Centered App Logo -->
    <div class="header">
        <div class="header-left">
            <h2>InvestmentAI Dashboard</h2>
        </div>
        
        <div class="header-center">
            <!-- Place your logo.png inside the frontend folder -->
            <img src="logo.png" alt="InvestmentAI Logo" style="height: 32px; width: auto; object-fit: contain;">
        </div>
        
        <div class="header-right">
            <span id="welcome-text" style="margin-right: 15px; font-weight: bold; font-size: 14px; color: #bbb;"></span>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- Phase 2: Input Tickers Group -->
    <button class="collapsible">Input Tickers</button>
    <div class="content">
        
        <h3 style="margin-top:20px; color: #ffffff;">New Tickers</h3>
        <p style="font-size: 14px; color: #888;">Enter up to 5 tickers below. Data is validated against live market data and saved securely.</p>
        
        <div id="message-box"></div>

        <table id="new-tickers-table">
            <thead>
                <tr>
                    <th>Ticker Symbol (e.g. CRM)</th>
                    <th>Shares</th>
                    <th>Buy Price ($)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 5 Rows generated by Javascript -->
            </tbody>
        </table>
        
        <div class="controls">
            <button class="btn-clear" onclick="clearNewTickers()">Clear</button>
            <button class="btn-save" onclick="validateAndSave()">Validate & Save</button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let currentUser = localStorage.getItem("investment_username");

        if (!currentUser) {
            window.location.href = "index.html";
        } else {
            document.getElementById("welcome-text").innerText = `Logged in as: ${currentUser}`;
            generateTableRows();
            loadSavedTickers();
        }

        var coll = document.getElementsByClassName("collapsible");
        for (let i = 0; i < coll.length; i++) {
            coll[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var content = this.nextElementSibling;
                if (content.style.maxHeight){
                    content.style.maxHeight = null;
                } else {
                    content.style.maxHeight = content.scrollHeight + 100 + "px";
                }
            });
        }

        function generateTableRows() {
            const tbody = document.querySelector("#new-tickers-table tbody");
            for(let i=0; i<5; i++) {
                tbody.innerHTML += `
                    <tr>
                        <td><input type="text" class="ticker-symbol" placeholder="Symbol" style="text-transform:uppercase"></td>
                        <td><input type="number" class="ticker-shares" placeholder="0.00" step="0.01"></td>
                        <td><input type="number" class="ticker-price" placeholder="0.00" step="0.01"></td>
                    </tr>
                `;
            }
        }

        async function loadSavedTickers() {
            try {
                const response = await fetch(`${API_URL}/portfolio/${currentUser}/new-tickers`);
                const data = await response.json();
                
                if(data.status === "success" && data.tickers.length > 0) {
                    const symbols = document.getElementsByClassName("ticker-symbol");
                    const shares = document.getElementsByClassName("ticker-shares");
                    const prices = document.getElementsByClassName("ticker-price");
                    
                    data.tickers.forEach((ticker, index) => {
                        if(index < 5) {
                            symbols[index].value = ticker.symbol;
                            shares[index].value = ticker.shares > 0 ? ticker.shares : "";
                            prices[index].value = ticker.buy_price > 0 ? ticker.buy_price : "";
                        }
                    });
                }
            } catch (error) {
                console.error("Failed to load tickers:", error);
            }
        }

        async function validateAndSave() {
            const symbols = document.getElementsByClassName("ticker-symbol");
            const shares = document.getElementsByClassName("ticker-shares");
            const prices = document.getElementsByClassName("ticker-price");
            
            let payload = { username: currentUser, tickers: [] };
            let hasInput = false;

            for(let i=0; i<5; i++) {
                if(symbols[i].value.trim() !== "") {
                    hasInput = true;
                    payload.tickers.push({
                        symbol: symbols[i].value.toUpperCase().trim(),
                        shares: parseFloat(shares[i].value) || 0,
                        buy_price: parseFloat(prices[i].value) || 0
                    });
                }
            }

            if(!hasInput) {
                showMessage("error", "Please enter at least one ticker symbol.");
                return;
            }

            showMessage("success", "Validating symbols with live market data... please wait.");

            try {
                const response = await fetch(`${API_URL}/portfolio/validate-and-save`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if(data.status === "success") {
                    showMessage("success", data.message);
                } else {
                    showMessage("error", data.message);
                }
            } catch (error) {
                showMessage("error", "Network error. Make sure the backend server is running.");
            }
        }

        async function clearNewTickers() {
            const inputs = document.querySelectorAll("#new-tickers-table input");
            inputs.forEach(input => input.value = "");
            
            try {
                await fetch(`${API_URL}/portfolio/${currentUser}/clear-new-tickers`, { method: "DELETE" });
                showMessage("success", "New Tickers cleared successfully.");
            } catch (error) {
                console.error("Failed to clear database:", error);
            }
        }

        function showMessage(type, text) {
            const box = document.getElementById("message-box");
            box.style.display = "block";
            box.className = type;
            box.innerText = text;
        }

        function logout() {
            localStorage.removeItem("investment_username");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
